name: Publish dev AIO CUDA image

# Fork/operator workflow: build only the all-in-one CUDA image from the selected
# ref and publish it under this fork's GHCR namespace with an explicit dev tag.
#
# Typical tag for testing on Unraid:
#   ghcr.io/kylejschultz/subwave-aio-cuda:lyrics-dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GHCR tag to publish, e.g. lyrics-dev"
        required: true
        default: lyrics-dev

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-aio-cuda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$IMAGE_TAG"
          if ! printf '%s' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "Invalid Docker tag: $tag" >&2
            exit 1
          fi

      - name: Free runner disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          df -h /

      - id: version
        run: echo "version=$(git describe --tags --always 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - id: sha
        run: echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.aio
          platforms: linux/amd64
          build-args: |
            WITH_CLAP=1
            WITH_DEMUCS=1
            WITH_CUDA=1
            SUBWAVE_BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/subwave-aio-cuda:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/subwave-aio-cuda:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=subwave-aio-cuda
